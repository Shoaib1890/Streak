services:
  db:
    image: postgres:16-alpine
    container_name: streak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: streak
      POSTGRES_PASSWORD: streak
      POSTGRES_DB: streak
    ports:
      - "5433:5432"
    volumes:
      - streak_pg_data:/var/lib/postgresql/data

volumes:
  streak_pg_data:
